<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lodge Podge · PICO-8 case study</title>
  <style>
    body{margin:24px auto;padding:0 24px;max-width:1250px;background:#11141d;color:#eee;font:15px/1.6 system-ui}a{color:#ff77a8}button,input,textarea,select{font:inherit}button{padding:8px 16px;cursor:pointer}textarea{box-sizing:border-box;width:100%;background:#202431;color:#fff;padding:12px;border:1px solid #53576a;border-radius:6px}main{display:grid;grid-template-columns:1fr 520px;gap:24px}#stage{width:512px;height:512px}canvas{image-rendering:pixelated;width:256px;height:256px;background:#000}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:450px;overflow:auto;font-size:12px}#history{max-height:300px;overflow:auto}#status{color:#ffccaa}@media(max-width:900px){main{display:block}#stage{width:100%;max-width:512px}}
  </style>
  <h1>Lodge Podge · PICO-8 创作实验</h1>
  <p>参考 <a href="https://developers.openai.com/blog/build-a-game-with-modretro-chromatic" target="_blank" rel="noreferrer">OpenAI 官方海狸建窝案例</a>。使用当前应用的 Agent、知识库与已保存的模型配置；独立临时卡带，普通 API 用量。</p>
  <p id="model"></p>
  <main>
    <section>
      <label for="prompt">游戏需求 / 后续反馈</label>
      <textarea id="prompt" rows="5">做一个叫 Lodge Podge 的 PICO-8 俯视角小游戏：玩家控制一只可爱的像素海狸，啃倒小树收集木棍，在地图中央建成自己的窝。画面温暖可爱，有动作动画、音效和轻松的背景音乐，完成后能重新开始。</textarea>
      <p><button id="send">生成第一版</button> <button id="stop" disabled>停止</button> <button id="export" disabled>导出当前 .p8</button></p>
      <p id="status" role="status">准备中</p>
      <p id="archive"></p>
      <ol id="history"></ol>
      <pre id="response"></pre>
      <details><summary>当前已提交 Lua</summary><pre id="source"></pre></details>
    </section>
    <section>
      <div id="stage"></div>
      <p>右侧为可操作预览。下方为独立测试 Worker 的真实帧；测试不代表人工听评。</p>
      <canvas id="frame" width="128" height="128" aria-label="最新测试帧"></canvas>
      <p id="revision"></p>
    </section>
  </main>
  <details open>
    <summary>独立试玩（不计入 agent 自测指标）</summary>
    <label for="action">操作</label>
    <select id="action"><option>reset_game</option><option>press_buttons</option><option>observe_game</option></select>
    <label for="args">JSON 参数</label>
    <textarea id="args" rows="2">{}</textarea>
    <button id="test" disabled>执行试玩</button>
    <pre id="test-result"></pre>
  </details>
  <script type="module" src="./case-study.js"></script>
</html>
