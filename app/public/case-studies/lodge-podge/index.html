<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lodge Podge · 海狸的小窝</title>
  <link rel="stylesheet" href="../../player/player.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <aside>
      <span class="eyebrow">PICO-8 · A LITTLE WOODLAND GAME</span>
      <h1>Lodge<br>Podge<span>海狸的小窝</span></h1>
      <p class="intro">找些树枝，捧一点泥，带几片落叶回来。<br>给小海狸搭一个暖暖的家。</p>
      <div class="instructions">
        <p><kbd>↑ ↓ ← →</kbd><span>在林间走动</span></p>
        <p><kbd>X</kbd><span>靠近树、落叶或泥地，按住采集</span></p>
        <p><b>回家</b><span>走到中央枝条圈，自动交付材料</span></p>
      </div>
      <label for="version">选择版本</label>
      <select id="version">
        <option value="final">第二版 · 木棍、泥和树叶</option>
        <option value="baseline">第一版 · 收集木棍</option>
      </select>
      <p class="note" id="version-note">收集 6 根木棍、3 份泥、3 份树叶。完成后按 X 重开。</p>
      <nav><a id="download" href="./final.p8" download>下载 .p8 卡带 ↗</a><a href="https://developers.openai.com/blog/build-a-game-with-modretro-chromatic" target="_blank" rel="noreferrer">OpenAI 原案例 ↗</a></nav>
      <p class="credit">参考 ModRetro 海狸建窝案例制作的 PICO-8 玩法改编。<br>保留两轮 Agent 的实际产出，方便试玩比较。</p>
    </aside>
    <section class="game"><div id="player"></div><p id="status" aria-live="polite">正在准备卡带…</p></section>
  </main>
  <script type="module" src="./play.js"></script>
</body>
</html>
