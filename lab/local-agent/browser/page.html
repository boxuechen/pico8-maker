<!doctype html><meta charset="utf-8"><title>lab browser run</title><pre id="log"></pre><script type="module">
// Fetch the job, hand it to the agent worker, relay progress and the result to the server.
const log = (s) => (document.getElementById("log").textContent += s + "\n");
const job = await (await fetch("/job")).json();
const worker = new Worker("/worker.js", { type: "module" });
worker.onerror = (e) => fetch("/result", { method: "POST", body: JSON.stringify({ status: "error", error: `worker: ${e.message}` }) });
worker.onmessage = ({ data }) => {
  if (data.type === "progress") { log(data.line); fetch("/progress", { method: "POST", body: data.line }); }
  if (data.type === "result") fetch("/result", { method: "POST", body: JSON.stringify(data.result) });
};
worker.postMessage(job);
</script>
